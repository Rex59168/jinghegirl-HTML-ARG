<script src="/assets/js/state.js"></script>
<script src="/assets/js/notebook.js"></script>
<script src="/assets/js/hint.js"></script>
<script src="/assets/js/ambient.js"></script>
<script>
const FILES = [
  { name: "001.txt", readable: false, size: "4 KB", date: "2016/05/22" },
  { name: "002.txt", readable: false, size: "4 KB", date: "2017/07/09" },
  { name: "003.txt", readable: false, size: "5 KB", date: "2018/06/30" },
  { name: "004.txt", readable: false, size: "4 KB", date: "2019/04/15" },
  { name: "005.txt", readable: false, size: "6 KB", date: "2020/01/28" },
  { name: "006.txt", readable: false, size: "5 KB", date: "2021/03/12" },
  { name: "007.txt", readable: true, size: "9 KB", date: "2022/02/19" },
  { name: "008.txt", readable: false, size: "4 KB", date: "2022/08/04" },
  { name: "009.txt", readable: false, size: "5 KB", date: "2023/01/17" },
  { name: "010.txt", readable: false, size: "4 KB", date: "2023/05/29" },
  { name: "011.txt", readable: false, size: "5 KB", date: "2023/09/02" },
  { name: "012.txt", readable: true, size: "11 KB", date: "2023/11/06" },
];

setTimeout(() => {
  document.getElementById("loading").style.display = "none";
}, 2000);

const tbody = document.getElementById("file-rows");
FILES.forEach((f) => {
  const tr = document.createElement("tr");
  if (f.readable) tr.className = "readable";
  tr.innerHTML = `
    <td class="fname">${f.name}</td>
    <td class="status">${f.readable ? "可讀" : "〔無法讀取〕"}</td>
    <td>${f.size}</td>
    <td>${f.date}</td>
  `;
  if (f.readable) {
    tr.addEventListener("click", () => openFile(f.name));
  }
  tbody.appendChild(tr);
});

function openFile(name) {
  if (name === "007.txt") {
    document.getElementById("detail-007").classList.add("open");
    JHNotebook.add("ch6_007", "林昭的檔案(007.txt)最後更新:2024/03/11——她 2022 年就失蹤了", "/files/collection.html");
  }
  if (name === "012.txt") {
    document.getElementById("detail-012").classList.add("open");
    JHNotebook.add("ch6_012", "林晞的檔案(012.txt)建檔日期:2023/11/06", "/files/collection.html");
    if (!JH.get("ch6_done")) {
      JH.set("ch6_done", true);
      document.getElementById("closing").style.display = "block";
      document.getElementById("closing").scrollIntoView({ behavior: "smooth" });
    }
  }
}

if (JH.get("ch6_done")) {
  document.getElementById("detail-007").classList.add("open");
  document.getElementById("detail-012").classList.add("open");
  document.getElementById("closing").style.display = "block";
}
</script>
